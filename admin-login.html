<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Navratri Dandiya Mahotsav 2.0 Nalagonda</title>
  <meta name="robots" content="noindex,nofollow">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Outfit:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-deep: #0a0103;
      --bg-card: rgba(26, 3, 7, 0.9);
      --gold-primary: #FFDE21;
      --gold-warm: #EAA812;
      --border-subtle: rgba(255, 222, 33, 0.2);
      --border-focus: #FFDE21;
      --text-white: #FFFFFF;
      --text-muted: rgba(255, 255, 255, 0.55);
      --font-display: 'Cinzel', Georgia, serif;
      --font-heading: 'Outfit', sans-serif;
      --font-body: 'Inter', system-ui, sans-serif;
    }

    html, body {
      min-height: 100%;
      background: var(--bg-deep);
      color: var(--text-white);
      font-family: var(--font-body);
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: radial-gradient(ellipse 80% 60% at 50% 10%, rgba(65, 8, 18, 0.5) 0%, transparent 70%), #0a0103;
      padding: 20px;
    }

    .login-card {
      width: min(440px, 94vw);
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: clamp(2rem, 5vw, 2.8rem) clamp(1.5rem, 4vw, 2.2rem);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.85);
    }

    .brand-header {
      margin-bottom: 1.8rem;
      padding-bottom: 1.2rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .brand-logo-text {
      font-family: var(--font-heading);
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--text-white);
    }

    .brand-logo-text span {
      color: var(--gold-primary);
    }

    .brand-sub {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold-warm);
      margin-top: 3px;
    }

    .card-title {
      font-family: var(--font-display);
      font-size: 1.55rem;
      font-weight: 800;
      color: var(--text-white);
      margin-bottom: 0.35rem;
    }

    .card-title span {
      color: var(--gold-primary);
    }

    .card-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 1.8rem;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      margin-bottom: 1.2rem;
    }

    .field-group label {
      font-family: var(--font-heading);
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold-warm);
      font-weight: 700;
    }

    .field-group input {
      background: rgba(10, 1, 3, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 6px;
      padding: 0.85rem 1rem;
      font-family: var(--font-body);
      font-size: 0.95rem;
      color: #fff;
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    .field-group input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(255, 222, 33, 0.15);
    }

    .btn-submit {
      width: 100%;
      padding: 0.95rem;
      background: var(--gold-primary);
      border: 1px solid var(--gold-primary);
      border-radius: 6px;
      color: #140103;
      font-family: var(--font-heading);
      font-size: 0.88rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 0.6rem;
      transition: all 0.25s ease;
      box-shadow: 0 6px 20px rgba(255, 222, 33, 0.25);
    }

    .btn-submit:hover:not(:disabled) {
      background: #FFF085;
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(255, 222, 33, 0.35);
    }

    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .err-message {
      font-size: 0.8rem;
      color: #ff6b6b;
      text-align: center;
      margin-top: 1rem;
      min-height: 1.2rem;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 1.6rem;
      font-size: 0.78rem;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: var(--gold-primary);
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="brand-header">
      <div class="brand-logo-text">DANDIYA MAHOTSAV <span>2.0</span></div>
      <div class="brand-sub">ORGANISED BY NANDHI YOUTH</div>
    </div>

    <h1 class="card-title">Admin <span>Portal</span></h1>
    <p class="card-desc">Sign in to manage pass registrations, verify payments, and handle event gate check-ins.</p>

    <form id="adminLoginForm" novalidate onsubmit="handleAdminLogin(event)">
      <div class="field-group">
        <label for="adminEmail">Admin Email</label>
        <input type="email" id="adminEmail" placeholder="admin@nandhiyouth.com" required autocomplete="username">
      </div>

      <div class="field-group">
        <label for="adminPassword">Access Password</label>
        <input type="password" id="adminPassword" placeholder="Enter password" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn-submit" id="btnLogin">Sign In to Dashboard</button>
      <div class="err-message" id="loginErrMsg"></div>
    </form>

    <a href="index.html" class="back-link">&larr; Back to event website</a>
  </div>

  <script>
    // Redirect if already authenticated
    if (localStorage.getItem('dandiya_admin_auth')) {
      window.location.href = 'admin.html';
    }

    function handleAdminLogin(e) {
      e.preventDefault();
      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value.trim();
      const errMsg = document.getElementById('loginErrMsg');
      const btn = document.getElementById('btnLogin');

      if (!email || !password) {
        errMsg.textContent = 'Please enter both email and password.';
        return;
      }

      // Check credentials
      btn.disabled = true;
      btn.textContent = 'Verifying...';
      errMsg.textContent = '';

      setTimeout(() => {
        const validUsers = [
          { email: 'admin@nandhiyouth.com', pass: 'dandiya@2026', name: 'Nandhi Youth Admin' },
          { email: 'shashank@dandiya.com', pass: 'dandiya@2026', name: 'Shashank (Coordinator)' },
          { email: 'abhi@dandiya.com', pass: 'dandiya@2026', name: 'Abhi (Coordinator)' },
          { email: 'admin@tedxsreyas.com', pass: 'dandiya@2026', name: 'Administrator' }
        ];

        const matched = validUsers.find(u => u.email.toLowerCase() === email.toLowerCase() && (password === u.pass || password === 'dandiya@2026'));

        // Allow any valid user or master password dandiya@2026
        if (matched || password === 'dandiya@2026') {
          const authData = {
            email: email,
            name: matched ? matched.name : 'Nandhi Youth Coordinator',
            loginTime: new Date().toISOString()
          };
          localStorage.setItem('dandiya_admin_auth', JSON.stringify(authData));
          window.location.href = 'admin.html';
        } else {
          errMsg.textContent = 'Invalid credentials. Please try again.';
          btn.disabled = false;
          btn.textContent = 'Sign In to Dashboard';
        }
      }, 350);
    }
  </script>
</body>
</html>
